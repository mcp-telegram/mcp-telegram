name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows failing must not cancel the Linux jobs (and vice versa) — a
      # platform-specific break should be reported as exactly that.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24]
        # Issue #69: the npm package could not start AT ALL on Windows. The
        # IPC endpoint was a filesystem path, which net.listen() rejects there
        # with EACCES; a Linux-only matrix could never see it. One Windows job
        # guards the platform split
        # in socketPath() without tripling CI time.
        include:
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx biome check src/
      - run: npx tsc --noEmit
      - run: npm run build
      # The suite (568 tests / 180 suites, ~7s) used to run only on developer
      # machines, so a regression could reach main with a green PR. Verified to
      # pass in a clean checkout with no .env and no session file present, so it
      # needs no secrets and stays hermetic.
      - run: npm test
      # Cloud compiles core with Bun and --frozen-lockfile. npm CI alone cannot
      # catch a stale bun.lock after dependency updates; validate it without
      # replacing npm's node_modules, using the Docker image's Bun version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: runner.os == 'Linux' && matrix.node-version == 22
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts --lockfile-only
        if: runner.os == 'Linux' && matrix.node-version == 22
      # Build the docs site so a dead link / broken VitePress fails the PR,
      # not main. Deploy Docs (docs.yml) only runs on push to main, so without
      # this a bad doc link is invisible until after merge (PR #49 hit this).
      # docs:build runs predocs:build (gen:changelog) first — the changelog
      # pages are generated from CHANGELOG.md, not committed, so this both
      # exercises the generator and produces the pages the build needs.
      # Linux-only: the docs output is platform-independent, so building it on
      # every OS would only add minutes without covering any extra risk.
      - run: npm run docs:build
        if: runner.os == 'Linux'
