name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx biome check src/
      - run: npx tsc --noEmit
      - run: npm run build
      # The suite (534 tests / 171 suites, ~7s) used to run only on developer
      # machines, so a regression could reach main with a green PR. Verified to
      # pass in a clean checkout with no .env and no session file present, so it
      # needs no secrets and stays hermetic.
      - run: npm test
      # Build the docs site so a dead link / broken VitePress fails the PR,
      # not main. Deploy Docs (docs.yml) only runs on push to main, so without
      # this a bad doc link is invisible until after merge (PR #49 hit this).
      # docs:build runs predocs:build (gen:changelog) first — the changelog
      # pages are generated from CHANGELOG.md, not committed, so this both
      # exercises the generator and produces the pages the build needs.
      - run: npm run docs:build
