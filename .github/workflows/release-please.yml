name: Release Please

# Maintains a rolling "Release PR" from Conventional Commits on main.
# Merge that PR → release-please creates the git tag + GitHub Release,
# then dispatches publish.yml for that tag to publish npm, Docker and
# standalone binaries. No manual version bump or changelog.
#
# With the release GitHub App configured (variable RELEASE_APP_CLIENT_ID and
# secret RELEASE_APP_PRIVATE_KEY), release-please acts as that App: the Release
# PR gets its CI like any other PR, and the GitHub Release starts publish.yml
# through its `release: published` trigger.
#
# Without the App it falls back to GITHUB_TOKEN. Events from GITHUB_TOKEN never
# start other workflows and its Release PR CI waits for manual approval, so the
# fallback dispatches publish.yml explicitly (workflow_dispatch is the
# documented exception).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # gh workflow run publish.yml
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        # v3.3.0
        uses:
          "actions/create-github-app-token\
          @64ab729a6294000f5aa4a4bc0b73d1f32bc45510"
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # v5's only breaking change vs v4 is the bundled runtime (Node 20 → 24),
      # so the old FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 opt-in is no longer
      # needed.
      # Config schema, inputs, and behavior are unchanged.
      # v5.0.0
      - id: release
        uses:
          "googleapis/release-please-action\
          @45996ed1f6d02564a971a2fa1b5860e934307cf7"

        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only on the GITHUB_TOKEN fallback: a release created by the App already
      # starts publish.yml, and a second run would publish twice.
      - name: Dispatch publish for the new release
        if: ${{ steps.release.outputs.release_created == 'true' && steps.app-token.outputs.token == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected release tag: $TAG"
            exit 1
          fi
          # Dispatch on the tag itself: publish-npm and publish-docker check
          # out the dispatched ref, so --ref main could ship newer commits.
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
