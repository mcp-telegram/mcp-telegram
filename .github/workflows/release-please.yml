name: Release Please

# Maintains a rolling "Release PR" from Conventional Commits on main.
# Merge that PR → release-please creates the git tag + GitHub Release,
# then dispatches publish.yml for that tag to publish npm, Docker and
# standalone binaries. No manual version bump or changelog.
#
# The release is created with GITHUB_TOKEN, and events from GITHUB_TOKEN
# never start other workflows, so publish.yml's `release: published`
# trigger does not fire for these releases. workflow_dispatch is the
# documented exception, hence the explicit dispatch step below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # gh workflow run publish.yml
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # v5's only breaking change vs v4 is the bundled runtime (Node 20 → 24),
      # so the old FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 opt-in is no longer
      # needed.
      # Config schema, inputs, and behavior are unchanged.
      # v5.0.0
      - id: release
        uses:
          "googleapis/release-please-action\
          @45996ed1f6d02564a971a2fa1b5860e934307cf7"

        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch publish for the new release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected release tag: $TAG"
            exit 1
          fi
          # Dispatch on the tag itself: publish-npm and publish-docker check
          # out the dispatched ref, so --ref main could ship newer commits.
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"

      # The Release PR is opened by github-actions[bot], so its pull_request CI
      # run stays at "approval required" and the required checks never report.
      # A dispatched run on the same branch reports them on the same commit.
      - name: Run CI on the release branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq '^release-please--[A-Za-z0-9._/-]+$'; then
            echo "::error::unexpected release branch: $BRANCH"
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
